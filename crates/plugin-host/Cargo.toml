[package]
name = "stream-markdown-plugin-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Optional WebAssembly rule host for stream-markdown-rs"

[dependencies]
stream-markdown-rs = { path = "../.." }
wasmi = { version = "2.0", default-features = false, features = ["std", "stable", "validate", "auto-dispatch"] }

[dev-dependencies]
wat = { version = "=1.246.2", default-features = false }
