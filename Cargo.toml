[package]
name = "stream-markdown-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Incremental CommonMark and GFM parser with typed updates and AI streaming previews for Rust TUIs"
repository = "https://github.com/Simon-He95/stream-markdown-rs"
readme = "README.md"
keywords = ["markdown", "commonmark", "gfm", "incremental", "tui"]
categories = ["parser-implementations", "text-processing"]
exclude = [
    "/docs/benchmarks/data/",
    "/fixtures/oracle-source.tar.gz",
    "/package.json",
    "/patches/",
    "/pnpm-lock.yaml",
    "/scripts/",
    "/test/",
    "/vitest.config.ts",
]

[dependencies]
memchr = "2.8"
smallvec = "1.15"
html-escape = "0.3.1"
unicode-casefold = "0.2"
unicode-general-category = "1.1"

[dev-dependencies]
serde_json = "1"

[[example]]
name = "spec_renderer"
test = true

[workspace]
resolver = "3"
members = ["crates/bench", "crates/plugin-host"]
